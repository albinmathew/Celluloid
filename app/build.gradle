apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'
apply plugin: 'dagger.hilt.android.plugin'

android {
    compileSdkVersion 33
    buildToolsVersion "33.0.0"

    defaultConfig {
        applicationId "me.albinmathew.celluloid"
        minSdkVersion 21
        targetSdkVersion 33
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.4.3'
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    testImplementation 'junit:junit:4.12'
    // implementation 'com.squareup.picasso:picasso:2.71828' // Removed
    // implementation 'com.squareup.retrofit:retrofit:1.9.0' // Old version
    // implementation 'com.github.bumptech.glide:glide:3.7.0' // Removed
    // implementation 'com.github.florent37:glidepalette:1.0.6' // Removed

    // Retrofit 2
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.10.0' // For logging

    // Room
    def room_version = "2.5.2"
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    kapt "androidx.room:room-compiler:$room_version"

    // Jetpack Compose
    def composeBom = platform('androidx.compose:compose-bom:2023.03.00')
    implementation composeBom
    androidTestImplementation composeBom

    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    implementation 'androidx.activity:activity-compose:1.7.0'

    // ViewModel & LiveData
    def lifecycle_version = "2.6.1"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:$lifecycle_version"

    // Kotlin Coroutines
    def coroutines_version = "1.7.1"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:$coroutines_version"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutines_version"

    // Navigation Compose
    def nav_version = "2.5.3"
    implementation "androidx.navigation:navigation-compose:$nav_version"

    // Hilt
    implementation "com.google.dagger:hilt-android:2.44"
    kapt "com.google.dagger:hilt-compiler:2.44"
    implementation "androidx.hilt:hilt-navigation-compose:1.0.0"

    // Coil for Image Loading
    implementation("io.coil-kt:coil-compose:2.4.0")

    // Material 2 for PullRefresh (used alongside Material 3)
    implementation "androidx.compose.material:material:1.6.0"

    // Testing Dependencies
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.1"
    testImplementation "app.cash.turbine:turbine:0.12.1"
    testImplementation "org.mockito:mockito-core:5.3.1"
    // testImplementation "io.mockk:mockk:1.13.5" // Alternative to Mockito
    testImplementation "androidx.arch.core:core-testing:2.2.0" // For InstantTaskExecutorRule if LiveData is used

    // UI Testing Dependencies
    androidTestImplementation platform('androidx.compose:compose-bom:2023.03.00') // Ensure BOM is used
    androidTestImplementation "androidx.compose.ui:ui-test-junit4"
    // debugImplementation "androidx.compose.ui:ui-tooling" // Already present
    debugImplementation "androidx.compose.ui:ui-test-manifest"

    // Hilt testing for AndroidTest
    androidTestImplementation "com.google.dagger:hilt-android-testing:2.44" // Use same Hilt version
    kaptAndroidTest "com.google.dagger:hilt-compiler:2.44" // Or kspAndroidTest
}
